name: MD-LU Patched SideStore Build

on:
  push:
    branches: [mdlu-build]
    paths:
      - '.github/workflows/mdlu.yml'
      - '.github/mdlu/md-lu-fix.patch'
  workflow_dispatch:

concurrency:
  group: mdlu-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build SideStore (MD-LU patched)
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      CHANNEL: nightly
      RELEASE_NAME: Nightly
      UPSTREAM_CHANNEL: ''
    steps:
      - name: Checkout build tooling (this branch)
        uses: actions/checkout@v5
        with:
          path: .mdlu
          fetch-depth: 1

      - name: Checkout SideStore at 044bd72a (user build commit)
        uses: actions/checkout@v5
        with:
          ref: 044bd72ad4eb270c3900bd04dc6f508d0ac474db
          submodules: recursive
          fetch-depth: 0
          clean: false

      - name: Prepare patched AnisetteKit
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/mahee96/AnisetteKit.git Dependencies/AnisetteKit-patched
          git -C Dependencies/AnisetteKit-patched checkout db8b41022697b6c19be8a5f01a1ce834145a2a26
          git -C Dependencies/AnisetteKit-patched apply "$GITHUB_WORKSPACE/.mdlu/.github/mdlu/md-lu-fix.patch"
          grep -q 'derivedLocalUserID' Dependencies/AnisetteKit-patched/Sources/AnisetteClient.swift
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('Dependencies/SideSign/Package.swift')
          s = p.read_text()
          old = '.package(url: "https://github.com/mahee96/AnisetteKit.git",   branch: "main"),'
          assert old in s, 'AnisetteKit dependency line not found verbatim'
          s = s.replace(old, '.package(name: "AnisetteKit", path: "../AnisetteKit-patched"),')
          p.write_text(s)
          print('SideSign Package.swift now uses local patched AnisetteKit')
          PYEOF
          python3 - <<'PYEOF'
          import json, glob, pathlib
          for f in glob.glob('**/Package.resolved', recursive=True):
              d = json.loads(pathlib.Path(f).read_text())
              if 'pins' in d:
                  pins = d['pins']
              elif 'object' in d and 'pins' in d['object']:
                  pins = d['object']['pins']
              else:
                  continue
              new = [x for x in pins if x.get('identity') != 'anisettekit']
              if len(new) != len(pins):
                  if 'pins' in d:
                      d['pins'] = new
                  else:
                      d['object']['pins'] = new
                  pathlib.Path(f).write_text(json.dumps(d, indent=2))
                  print('stripped anisettekit pin from', f)
          PYEOF

      - name: Install build tools
        run: brew install ldid xcbeautify

      - name: Setup environment
        run: |
          echo "MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)" >> "$GITHUB_ENV"
          echo "NORMALIZED_MARKETING_VERSION=$(python3 scripts/ci/workflow.py compute-normalized "$MARKETING_VERSION")" >> "$GITHUB_ENV"
          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED_MARKETING_VERSION"
          echo "COMMIT_ID=$(python3 scripts/ci/workflow.py commit-id)" >> "$GITHUB_ENV"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '27.2'

      - name: Pre-populate binary artifacts cache
        run: |
          python3 scripts/ci/cache.py populate https://github.com/SideStore/OpenSSL/releases/download/3.5.4/openssl-ios-sim-3.5.4.tar.gz || true
          python3 scripts/ci/cache.py populate https://github.com/SideStore/unicorn-ios/releases/download/2.1.4/libunicorn-ios-sim-2.1.4.tar.gz || true
          python3 scripts/ci/cache.py populate https://github.com/SideStore/unicorn-ios/releases/download/2.1.4/libunicorn-ios-2.1.4.tar.gz || true

      - name: Build SideStore
        run: python3 scripts/ci/workflow.py build

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/logs
          if-no-files-found: ignore

      - name: Upload SideStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-mdlu.ipa
          path: SideStore.ipa
          if-no-files-found: error
